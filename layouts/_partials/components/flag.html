{{/* Inline SVG flag for a language code. Usage: partial "components/flag.html" "en" */}}
{{- if eq . "en" -}}
<svg viewBox="0 0 190 100" width="27" height="18" aria-hidden="true" focusable="false" preserveAspectRatio="none">
  <rect width="190" height="100" fill="#B22234"/>
  <path d="M0 11.54h190M0 26.92h190M0 42.31h190M0 57.69h190M0 73.08h190M0 88.46h190" stroke="#FFF" stroke-width="7.69"/>
  <rect width="76" height="53.85" fill="#3C3B6E"/>
  <g fill="#FFF">
    {{- range $row := seq 0 4 -}}
      {{- range $col := seq 0 5 -}}
        <circle cx="{{ add 6.33 (mul $col 12.67) }}" cy="{{ add 5.385 (mul $row 10.77) }}" r="2"/>
      {{- end -}}
    {{- end -}}
    {{- range $row := seq 0 3 -}}
      {{- range $col := seq 0 4 -}}
        <circle cx="{{ add 12.67 (mul $col 12.67) }}" cy="{{ add 10.77 (mul $row 10.77) }}" r="2"/>
      {{- end -}}
    {{- end -}}
  </g>
</svg>
{{- else if eq . "pt" -}}
<svg viewBox="0 0 720 504" width="27" height="18" aria-hidden="true" focusable="false" preserveAspectRatio="none">
  <rect width="720" height="504" fill="#009C3B"/>
  <path d="M360 42 678 252 360 462 42 252Z" fill="#FFDF00"/>
  <circle cx="360" cy="252" r="122" fill="#002776"/>
  <path d="M241 224A300 300 0 0 1 476 287" fill="none" stroke="#FFF" stroke-width="22"/>
</svg>
{{- end -}}
